[package]
name = "solink-tracing-flat-json"
version = "1.0.0"
edition = "2024"
description = "Log flattened JSON in tracing."
license = "MIT"

[dependencies]
chrono = "0.4.44"
serde = "1.0.228"
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-serde = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["json"] }

[dev-dependencies]
tokio = { version = "1.51.1", features = ["rt", "macros"] }
